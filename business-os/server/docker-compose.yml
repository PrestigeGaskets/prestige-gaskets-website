services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rushmore
      POSTGRES_USER: rushmore
      POSTGRES_PASSWORD: rushmore
    ports:
      - "5432:5432"
    volumes:
      - rushmore_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rushmore -d rushmore"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: server/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      RUSHMORE_DB_HOST: db
      RUSHMORE_DB_PORT: 5432
      RUSHMORE_DB_NAME: rushmore
      RUSHMORE_DB_USER: rushmore
      RUSHMORE_DB_PASSWORD: rushmore
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  rushmore_pg:
